[package]
name = "portwerk"
version = "0.1.0"
edition = "2024"
description = "Terminal für serielle Schnittstellen, TCP-Client, TCP-Server und UDP"
repository = "https://github.com/johmarjac/PortWerk"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = { version = "4.10", default-features = false }
serde = { version = "1", features = ["derive"] }
rfd = "0.18.0"
chrono = "0.4.45"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Linux .deb package (built by the release workflow with cargo-deb)
[package.metadata.deb]
name = "portwerk"
maintainer = "PortWerk <noreply@github.com>"
section = "devel"
priority = "optional"
extended-description = """\
Serielle Schnittstellen, TCP-Client, TCP-Server und UDP in einem Fenster. \
Anzeige als Text oder Hex, Sendezeilen, Schleifen, Lua-Skripte, ASCII-Tabelle \
und Prüfsummen-Werkzeuge."""
depends = "$auto"
assets = [
    ["target/release/portwerk", "usr/bin/", "755"],
    ["packaging/linux/portwerk.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/portwerk/README.md", "644"],
]
